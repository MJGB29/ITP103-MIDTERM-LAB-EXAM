# slf4j-simple configuration: everything goes to stdout so the console evidence stays in order
org.slf4j.simpleLogger.logFile=System.out
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.levelInBrackets=true
org.slf4j.simpleLogger.showShortLogName=false
# keep third-party noise down, keep Camel context start/stop lines
org.slf4j.simpleLogger.log.org.apache.activemq=warn
org.slf4j.simpleLogger.log.org.apache.camel=warn
org.slf4j.simpleLogger.log.org.apache.camel.impl.engine.AbstractCamelContext=info
org.slf4j.simpleLogger.log.org.springframework=warn
