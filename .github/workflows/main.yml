name: Build and deploy MARSLINE site

# Runs the five Camel/ActiveMQ tasks on GitHub, saves their real console output,
# and publishes the project website (index.html) with that output to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:            # builds and runs the tasks, but never deploys
  workflow_dispatch:       # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run all five tasks and save the console output
        shell: bash
        run: |
          mkdir -p site/evidence
          for t in task1 task2 task3 task4 task5; do
            echo "::group::Running $t"
            mvn -B -ntp compile exec:java -Dexec.args="$t" > "site/evidence/$t.txt" 2>&1 || true
            cat "site/evidence/$t.txt"
            echo "::endgroup::"
          done

      - name: Summarise the checkpoints
        shell: bash
        run: |
          {
            echo "### MARSLINE checkpoints"
            echo ""
            echo "| Task | Status |"
            echo "|------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"
          for t in task1 task2 task3 task4 task5; do
            s=$(grep -Eo 'Status +: +(PASS|FAIL)' "site/evidence/$t.txt" | tail -1 | awk '{print $NF}')
            s=${s:-NO RESULT}
            echo "| $t | $s |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$s" != "PASS" ]; then
              echo "::warning title=$t::Checkpoint status is $s. The site will show this honestly."
            fi
          done

      - name: Assemble the site folder
        shell: bash
        run: cp index.html site/index.html

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload the site as a Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
